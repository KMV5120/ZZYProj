# ============================================================================
# ZZyProj 子路径转发（插入 /etc/nginx/sites-available/learning-assistant
# 的 server_name kmv-learning-assistant.xyz 块内，location / 之前）
# 安装前：cp 配置到 .bak-20261022；安装后：nginx -t && nginx -s reload
# 摘除：删掉这两段 + reload；容器停止即完全下线。
# ============================================================================

location = /ZZYProj {
    return 301 /ZZYProj/;
}

location /ZZYProj/ {
    # 末尾斜杠：把 /ZZYProj/ 前缀剥掉再转给容器
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE：关闭缓冲与缓存，否则会“想半天一次性吐出来”
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;

    client_max_body_size 1m;
}
